name: odk-test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile ODI 1.1 reference drivers
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iinclude -c examples/86box-ne2000/driver.c -o /tmp/ne2000.o
          cc -std=c11 -Wall -Wextra -Werror -Iinclude -c examples/86box-ide-pio/driver.c -o /tmp/ata-pio.o
      - name: Run ODK unit and corruption tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile a generated multi-architecture scaffold
        run: |
          tmp=$(mktemp -d)
          python3 odk.py new "$tmp/generated" --class network --bus pci --arch i686 --arch aarch64
          cc -std=c11 -Wall -Wextra -Werror -Iinclude -c "$tmp/generated/driver.c" -o /tmp/generated.o
          grep -q 'ODI_ARCH_BIT(ODI_ARCH_I686)|ODI_ARCH_BIT(ODI_ARCH_AARCH64)' "$tmp/generated/driver.c"
